<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:transparent;pointer-events:none;
}
:root{--left:22px;--bottom:112px}
#widget{
  position:fixed;left:var(--left);bottom:var(--bottom);
  width:240px;height:10px;transform-origin:left bottom;
  opacity:.98;filter:drop-shadow(0 1px 1px rgba(0,0,0,.72));z-index:10;
}
#charges{display:flex;width:240px;height:10px;gap:0}
.charge{position:relative;width:48px;height:10px;flex:0 0 48px;overflow:visible}
.charge img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.empty,.locked{position:absolute;inset:0;width:48px;height:10px}
.fillClip{
  position:absolute;left:2px;top:1px;width:0;height:8px;
  overflow:hidden;border-radius:8px;pointer-events:none;
  transition:width .085s linear,filter .16s ease;
}
.fill{position:absolute;left:0;top:0;width:44px;height:8px;max-width:none}
.charge .locked{opacity:1}
.charge .empty{opacity:0}
.charge.unlocked .locked{opacity:0}
.charge.unlocked .empty{opacity:1}
.charge:not(.unlocked) .fillClip{width:0!important;filter:none}
.charge.available .fillClip{filter:drop-shadow(0 0 2px rgba(214,176,86,.42))}
.charge.recharging .fillClip{filter:drop-shadow(0 0 2px rgba(214,176,86,.32))}
.charge.unlocking .fillClip{
  transition:width .7s cubic-bezier(.16,.78,.24,1),filter .7s ease;
  filter:drop-shadow(0 0 4px rgba(229,192,101,.78));
}
</style>
</head>

    const root=document.createElement("div");
    root.className="charge";
    root.dataset.index=String(i);

    const locked=document.createElement("img");
    locked.className="locked";
    locked.src=LOCKED;

    const empty=document.createElement("img");
    empty.className="empty";
    empty.src=EMPTY;

    const fillClip=document.createElement("div");
    fillClip.className="fillClip";
    const fill=document.createElement("img");
    fill.className="fill";
    fill.src=FILL;
    fillClip.appendChild(fill);

    root.append(locked,empty,fillClip);
    chargesRoot.appendChild(root);
    return {root,fillClip};
  }

  for(let i=0;i<5;i++) chargeNodes.push(makeCharge(i));

  function setLayout(left,bottom,scale){
    document.documentElement.style.setProperty("--left",clamp(left,0,4000)+"px");
    document.documentElement.style.setProperty("--bottom",clamp(bottom,0,4000)+"px");
    widget.style.transform="scale("+(clamp(scale,50,250)/100)+")";
  }

  function render(state){
    const current=Math.max(0,Math.min(5,Math.round(Number(state&&state.current)||0)));
    const max=Math.max(0,Math.min(5,Math.round(Number(state&&state.max)||0)));
    const progress=clamp(state&&state.progress||0,0,1);
    const previous=lastMax;
    const increased=previous!==null&&max>previous;

    chargeNodes.forEach((n,i)=>{
      const unlocked=i<max;
      const available=unlocked&&i<current;
      const recharging=unlocked&&i===current&&current<max;

      n.root.classList.toggle("unlocked",unlocked);
      n.root.classList.toggle("available",available);
      n.root.classList.toggle("recharging",recharging);

      const amount=available?1:(recharging?progress:0);
      const newly=increased&&i>=previous&&i<max;

      if(newly){
        n.root.classList.add("unlocking");
        setFill(n,0,true);
        requestAnimationFrame(()=>requestAnimationFrame(()=>setFill(n,amount)));
        setTimeout(()=>n.root.classList.remove("unlocking"),850);
      }else{
        setFill(n,amount);
      }
    });

    lastMax=max;
  }

  window.TechniqueHUD={
    setLayout,
    setState(state){render(state||{})}
  };

  render({current:0,max:0,progress:0,recovery:0});
})();
</script>
</body>
</html>
