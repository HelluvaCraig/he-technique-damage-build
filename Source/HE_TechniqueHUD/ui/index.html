<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width:100%; height:100%; margin:0; overflow:hidden;
    background:transparent; pointer-events:none;
    font-family:Georgia, "Times New Roman", serif;
  }

  :root {
    --size:72px;
    --left:22px;
    --bottom:112px;
    --ready:#78d7e2;
    --white:#f5f5f0;
  }

  #widget {
    position:fixed;
    left:var(--left);
    bottom:var(--bottom);
    width:var(--size);
    height:var(--size);
    opacity:.94;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.72));
    z-index:10;
  }

  .sigilLayer {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .sigilLayer svg {
    width:100%;
    height:100%;
    overflow:visible;
    display:block;
  }

  .lineHeavy,
  .lineMedium,
  .lineFine {
    fill:none;
    stroke:currentColor;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .lineHeavy  { stroke-width:1.8; }
  .lineMedium { stroke-width:1.25; }
  .lineFine   { stroke-width:.82; }

  .solid {
    fill:currentColor;
    stroke:none;
  }

  /* Base ghost: all three tier shapes stay faintly visible. */
  #base {
    color:var(--white);
    opacity:1;
  }
  #base .tierBorder,
  #base .tierMoons,
  #base .tierSword {
    opacity:.18;
  }

  .tierFill {
    color:var(--white);
    opacity:1;
    filter:none;
    transition:clip-path .065s linear, color .13s ease, filter .18s ease;
  }

  /* Each fill layer owns exactly one cooldown. */
  #tier1Fill .tierMoons,
  #tier1Fill .tierSword { display:none; }

  #tier2Fill .tierBorder,
  #tier2Fill .tierSword { display:none; }

  #tier3Fill .tierBorder,
  #tier3Fill .tierMoons { display:none; }

  /* Equipped tier uses cyan; the other tiers remain white. */
  #tier1Fill.equipped,
  #tier2Fill.equipped,
  #tier3Fill.equipped {
    color:var(--ready);
    filter:drop-shadow(0 0 1.15px rgba(120,215,226,.95));
  }

  body.settings-open { pointer-events:auto; }

  #settingsPanel {
    display:none;
    position:fixed;
    right:4.5vw;
    top:17vh;
    width:min(390px, 36vw);
    box-sizing:border-box;
    padding:20px 22px 18px;
    pointer-events:auto;
    color:#eee9dc;
    background:linear-gradient(180deg, rgba(24,25,25,.96), rgba(12,13,13,.94));
    border:1px solid rgba(203,178,123,.52);
    box-shadow:0 10px 36px rgba(0,0,0,.58), inset 0 0 0 1px rgba(255,255,255,.025);
    z-index:100;
  }

  body.settings-open #settingsPanel { display:block; }

  #settingsPanel::before,
  #settingsPanel::after {
    content:"";
    position:absolute;
    left:18px;
    right:18px;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(203,178,123,.42), transparent);
  }
  #settingsPanel::before { top:47px; }
  #settingsPanel::after { bottom:49px; }

  .settingsTitle {
    margin:0 0 22px;
    text-align:center;
    font-size:19px;
    letter-spacing:.12em;
    font-weight:normal;
    color:#f2eee4;
  }

  .settingRow { margin:0 0 18px; }

  .settingHeader {
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:8px;
  }

  .settingLabel {
    font-size:13px;
    letter-spacing:.045em;
    color:#e4dfd3;
  }

  .settingValue {
    min-width:56px;
    text-align:right;
    font-size:12px;
    color:#cdbb91;
    font-variant-numeric:tabular-nums;
  }

  input[type="range"] {
    width:100%;
    margin:0;
    accent-color:#b89b61;
  }

  .settingsHint {
    margin:3px 0 17px;
    font-size:11px;
    line-height:1.45;
    color:rgba(235,231,220,.58);
  }

  .buttons {
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding-top:14px;
  }

  button {
    min-width:92px;
    padding:7px 11px;
    border:1px solid rgba(203,178,123,.44);
    background:rgba(255,255,255,.035);
    color:#ebe6d9;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.055em;
    cursor:pointer;
  }

  button:hover,
  button:focus {
    outline:none;
    background:rgba(203,178,123,.12);
    border-color:rgba(220,196,143,.72);
  }
</style>
</head>
<body>
<div id="widget">
  <div id="base" class="sigilLayer"></div>
  <div id="tier1Fill" class="sigilLayer tierFill"></div>
  <div id="tier2Fill" class="sigilLayer tierFill"></div>
  <div id="tier3Fill" class="sigilLayer tierFill"></div>
</div>

<div id="settingsPanel" aria-hidden="true">
  <h1 class="settingsTitle">TECHNIQUE HUD</h1>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Horizontal position</span>
      <span id="leftValue" class="settingValue">22 px</span>
    </div>
    <input id="leftSlider" type="range" min="0" max="1920" step="1" value="22">
  </div>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Vertical position</span>
      <span id="bottomValue" class="settingValue">112 px</span>
    </div>
    <input id="bottomSlider" type="range" min="0" max="1080" step="1" value="112">
  </div>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Size</span>
      <span id="sizeValue" class="settingValue">72 px</span>
    </div>
    <input id="sizeSlider" type="range" min="40" max="200" step="1" value="72">
  </div>

  <p class="settingsHint">
    Position changes are shown live. Horizontal is measured from the left edge;
    vertical is measured upward from the bottom edge. Changes are saved automatically.
  </p>

  <div class="buttons">
    <button id="resetButton" type="button">RESET</button>
    <button id="closeButton" type="button">CLOSE</button>
  </div>
</div>

<script>
(() => {
  const widget = document.getElementById('widget');
  const base = document.getElementById('base');
  const tier1Fill = document.getElementById('tier1Fill');
  const tier2Fill = document.getElementById('tier2Fill');
  const tier3Fill = document.getElementById('tier3Fill');
  const panel = document.getElementById('settingsPanel');

  const leftSlider = document.getElementById('leftSlider');
  const bottomSlider = document.getElementById('bottomSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const leftValue = document.getElementById('leftValue');
  const bottomValue = document.getElementById('bottomValue');
  const sizeValue = document.getElementById('sizeValue');
  const resetButton = document.getElementById('resetButton');
  const closeButton = document.getElementById('closeButton');

  const defaults = { left:22, bottom:112, size:72 };
  let settingsOpen = false;

  const art = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="tierBorder">
        <path class="lineHeavy" d="M50 5 L95 50 L50 95 L5 50 Z"/>
        <path class="lineMedium" d="M50 11 L89 50 L50 89 L11 50 Z"/>
        <path class="lineFine" d="M50 5 V1 M50 95 V99"/>
        <g class="edgeRunes lineFine">
          <path d="M24 15 V25 M24 20 L19 15 M24 20 L29 15"/>
          <path d="M76 25 V15 M71 20 L76 15 L81 20"/>
          <path d="M91 35 L85 40 L91 45"/>
          <path d="M88 59 L84 64 L89 67 L85 72"/>
          <path d="M73 83 V73 M73 76 L79 73 M73 79 L78 77"/>
          <path d="M27 73 V83 M27 73 L33 77 L27 79 M27 79 L33 83"/>
          <path d="M12 59 L17 64 L13 68 L18 73"/>
          <path d="M9 35 L15 40 L9 45"/>
        </g>
      </g>

      <g class="tierMoons">
        <path class="solid" fill-rule="evenodd" d="M40 36 A14 14 0 1 0 40 64 A8.2 11.2 0 1 1 40 36 Z"/>
        <path class="solid" fill-rule="evenodd" d="M60 36 A14 14 0 1 1 60 64 A8.2 11.2 0 1 0 60 36 Z"/>
      </g>

      <g class="tierSword">
        <path class="solid" d="M50 11 L53.2 17.8 L52.1 65.8 L50 72.2 L47.9 65.8 L46.8 17.8 Z"/>
        <path class="lineFine" d="M50 18.2 V65.6"/>
        <path class="solid" d="M35 69.2 H65 L60.8 73.4 H39.2 Z"/>
        <rect class="solid" x="48.35" y="72.6" width="3.3" height="12.2" rx=".78"/>
        <path class="lineFine" d="M48.7 76.2 H51.3 M48.7 79.2 H51.3 M48.7 82.2 H51.3"/>
        <circle class="solid" cx="50" cy="88.2" r="2.9"/>
        <path class="lineFine" d="M47.95 88.2 H52.05 M50 86.15 V90.25"/>
      </g>
    </svg>`

  base.innerHTML = art;
  tier1Fill.innerHTML = art;
  tier2Fill.innerHTML = art;
  tier3Fill.innerHTML = art;

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, Number(v) || 0));
  }

  function setLayerFill(layer, value) {
    const p = clamp(value, 0, 1);
    layer.style.clipPath = `inset(${((1 - p) * 100).toFixed(2)}% 0 0 0)`;
  }

  function setEquippedTier(tier) {
    [tier1Fill, tier2Fill, tier3Fill].forEach(layer => layer.classList.remove('equipped'));
    const t = Number(tier) || 0;
    if (t === 1) tier1Fill.classList.add('equipped');
    if (t === 2) tier2Fill.classList.add('equipped');
    if (t === 3) tier3Fill.classList.add('equipped');
  }

  function updateSliderBounds() {
    const size = clamp(sizeSlider.value, 40, 200);
    leftSlider.max = String(Math.max(0, Math.floor(window.innerWidth - size)));
    bottomSlider.max = String(Math.max(0, Math.floor(window.innerHeight - size)));
  }

  function setLayout(left, bottom, size) {
    const safeSize = clamp(size, 40, 200);
    const safeLeft = clamp(left, 0, 4000);
    const safeBottom = clamp(bottom, 0, 4000);
    document.documentElement.style.setProperty('--left', `${safeLeft}px`);
    document.documentElement.style.setProperty('--bottom', `${safeBottom}px`);
    document.documentElement.style.setProperty('--size', `${safeSize}px`);
  }

  function readSliderLayout() {
    return {
      left: Math.round(Number(leftSlider.value) || 0),
      bottom: Math.round(Number(bottomSlider.value) || 0),
      size: Math.round(Number(sizeSlider.value) || 72)
    };
  }

  function refreshSettingLabels() {
    const v = readSliderLayout();
    leftValue.textContent = `${v.left} px`;
    bottomValue.textContent = `${v.bottom} px`;
    sizeValue.textContent = `${v.size} px`;
  }

  function applySlidersLive() {
    updateSliderBounds();
    const v = readSliderLayout();
    setLayout(v.left, v.bottom, v.size);
    refreshSettingLabels();
  }

  function persistSliders() {
    const v = readSliderLayout();
    try {
      if (typeof window.HEHUDApply === 'function') window.HEHUDApply(`${v.left}|${v.bottom}|${v.size}`);
    } catch (_) {}
  }

  function setSliderValues(left, bottom, size) {
    sizeSlider.value = String(clamp(size, 40, 200));
    updateSliderBounds();
    leftSlider.value = String(clamp(left, 0, Number(leftSlider.max)));
    bottomSlider.value = String(clamp(bottom, 0, Number(bottomSlider.max)));
    applySlidersLive();
  }

  [leftSlider, bottomSlider, sizeSlider].forEach(slider => {
    slider.addEventListener('input', applySlidersLive);
    slider.addEventListener('change', () => {
      applySlidersLive();
      persistSliders();
    });
  });

  resetButton.addEventListener('click', () => {
    setSliderValues(defaults.left, defaults.bottom, defaults.size);
    persistSliders();
  });

  closeButton.addEventListener('click', () => {
    persistSliders();
    try { if (typeof window.HEHUDClose === 'function') window.HEHUDClose(''); } catch (_) {}
  });

  window.addEventListener('resize', () => {
    if (settingsOpen) applySlidersLive();
  });

  document.addEventListener('keydown', e => {
    if (!settingsOpen) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      persistSliders();
      try { if (typeof window.HEHUDClose === 'function') window.HEHUDClose(''); } catch (_) {}
    }
  });

  window.TechniqueHUD = {
    setLayout,

    openSettings(left, bottom, size) {
      setSliderValues(left, bottom, size);
      settingsOpen = true;
      document.body.classList.add('settings-open');
      panel.setAttribute('aria-hidden', 'false');
    },

    closeSettings() {
      settingsOpen = false;
      document.body.classList.remove('settings-open');
      panel.setAttribute('aria-hidden', 'true');
    },

    setState(state) {
      const equippedTier = state ? Number(state.equippedTier) || 0 : 0;
      setEquippedTier(equippedTier);

      setLayerFill(tier1Fill, state ? state.p1 : 1);
      setLayerFill(tier2Fill, state ? state.p2 : 1);
      setLayerFill(tier3Fill, state ? state.p3 : 1);

    }
  };
})();
</script>
</body>
</html>
