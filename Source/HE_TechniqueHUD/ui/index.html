<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width:100%; height:100%; margin:0; overflow:hidden;
    background:transparent; pointer-events:none;
    font-family:Georgia, "Times New Roman", serif;
  }

  :root {
    --size:72px;
    --left:22px;
    --bottom:112px;
    --ready:#78d7e2;
    --white:#f5f5f0;
  }

  #widget {
    position:fixed;
    left:var(--left);
    bottom:var(--bottom);
    width:var(--size);
    height:var(--size);
    opacity:.94;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.72));
    z-index:10;
  }

  .sigilLayer {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .sigilLayer svg {
    width:100%;
    height:100%;
    overflow:visible;
    display:block;
  }

  .lineHeavy,
  .lineMedium,
  .lineFine {
    fill:none;
    stroke:currentColor;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .lineHeavy  { stroke-width:1.8; }
  .lineMedium { stroke-width:1.25; }
  .lineFine   { stroke-width:.82; }

  .solid {
    fill:currentColor;
    stroke:none;
  }

  /* The whole sigil remains readable in its normal resting state. */
  #base {
    color:var(--white);
    opacity:1;
  }

  #base .tierBorder,
  #base .tierMoons,
  #base .tierSword {
    opacity:.72;
    transition:opacity .14s ease;
  }

  /* The live fill only contains the section owned by the equipped tier. */
  #charged {
    color:var(--white);
    clip-path:inset(100% 0 0 0);
    opacity:1;
    filter:none;
    transition:clip-path .065s linear, color .13s ease, filter .18s ease;
  }

  #charged .tierMoons,
  #charged .tierSword { display:none; }
  #widget.tier2 #charged .tierMoons,
  #widget.tier3 #charged .tierMoons { display:inline; }
  #widget.tier3 #charged .tierSword { display:inline; }

  /* No Stone: a clear but quiet white sigil, not an almost invisible ghost. */
  #widget.unequipped #base .tierBorder,
  #widget.unequipped #base .tierMoons,
  #widget.unequipped #base .tierSword { opacity:.68; }
  #widget.unequipped #charged { opacity:0; filter:none; }

  /* Cooldown: only the owned tier section fades back, then refills upward in white. */
  #widget.cooling.tier1 #base .tierBorder { opacity:.12; }
  #widget.cooling.tier2 #base .tierBorder,
  #widget.cooling.tier2 #base .tierMoons { opacity:.12; }
  #widget.cooling.tier3 #base .tierBorder,
  #widget.cooling.tier3 #base .tierMoons,
  #widget.cooling.tier3 #base .tierSword { opacity:.12; }
  #widget.cooling #charged {
    color:var(--white);
    opacity:1;
    filter:none;
  }

  /* Ready but blocked by weapon/resource requirements: owned section is solid white. */
  #widget.blocked #charged {
    color:var(--white);
    opacity:1;
    filter:none;
  }

  /* Ready and usable: owned tier section turns cyan. */
  #widget.ready #charged {
    color:var(--ready);
    opacity:1;
    filter:drop-shadow(0 0 1.15px rgba(120,215,226,.95));
  }

  body.settings-open { pointer-events:auto; }

  #settingsPanel {
    display:none;
    position:fixed;
    right:4.5vw;
    top:17vh;
    width:min(390px, 36vw);
    box-sizing:border-box;
    padding:20px 22px 18px;
    pointer-events:auto;
    color:#eee9dc;
    background:linear-gradient(180deg, rgba(24,25,25,.96), rgba(12,13,13,.94));
    border:1px solid rgba(203,178,123,.52);
    box-shadow:0 10px 36px rgba(0,0,0,.58), inset 0 0 0 1px rgba(255,255,255,.025);
    z-index:100;
  }

  body.settings-open #settingsPanel { display:block; }

  #settingsPanel::before,
  #settingsPanel::after {
    content:"";
    position:absolute;
    left:18px;
    right:18px;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(203,178,123,.42), transparent);
  }
  #settingsPanel::before { top:47px; }
  #settingsPanel::after { bottom:49px; }

  .settingsTitle {
    margin:0 0 22px;
    text-align:center;
    font-size:19px;
    letter-spacing:.12em;
    font-weight:normal;
    color:#f2eee4;
  }

  .settingRow { margin:0 0 18px; }

  .settingHeader {
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:8px;
  }

  .settingLabel {
    font-size:13px;
    letter-spacing:.045em;
    color:#e4dfd3;
  }

  .settingValue {
    min-width:56px;
    text-align:right;
    font-size:12px;
    color:#cdbb91;
    font-variant-numeric:tabular-nums;
  }

  input[type="range"] {
    width:100%;
    margin:0;
    accent-color:#b89b61;
  }

  .settingsHint {
    margin:3px 0 17px;
    font-size:11px;
    line-height:1.45;
    color:rgba(235,231,220,.58);
  }

  .buttons {
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding-top:14px;
  }

  button {
    min-width:92px;
    padding:7px 11px;
    border:1px solid rgba(203,178,123,.44);
    background:rgba(255,255,255,.035);
    color:#ebe6d9;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.055em;
    cursor:pointer;
  }

  button:hover,
  button:focus {
    outline:none;
    background:rgba(203,178,123,.12);
    border-color:rgba(220,196,143,.72);
  }
</style>
</head>
<body>
<div id="widget" class="unequipped tier1">
  <div id="base" class="sigilLayer"></div>
  <div id="charged" class="sigilLayer"></div>
</div>

<div id="settingsPanel" aria-hidden="true">
  <h1 class="settingsTitle">TECHNIQUE HUD</h1>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Horizontal position</span>
      <span id="leftValue" class="settingValue">22 px</span>
    </div>
    <input id="leftSlider" type="range" min="0" max="1920" step="1" value="22">
  </div>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Vertical position</span>
      <span id="bottomValue" class="settingValue">112 px</span>
    </div>
    <input id="bottomSlider" type="range" min="0" max="1080" step="1" value="112">
  </div>

  <div class="settingRow">
    <div class="settingHeader">
      <span class="settingLabel">Size</span>
      <span id="sizeValue" class="settingValue">72 px</span>
    </div>
    <input id="sizeSlider" type="range" min="40" max="200" step="1" value="72">
  </div>

  <p class="settingsHint">
    Position changes are shown live. Horizontal is measured from the left edge;
    vertical is measured upward from the bottom edge. Changes are saved automatically.
  </p>

  <div class="buttons">
    <button id="resetButton" type="button">RESET</button>
    <button id="closeButton" type="button">CLOSE</button>
  </div>
</div>

<script>
(() => {
  const widget = document.getElementById('widget');
  const base = document.getElementById('base');
  const charged = document.getElementById('charged');
  const panel = document.getElementById('settingsPanel');

  const leftSlider = document.getElementById('leftSlider');
  const bottomSlider = document.getElementById('bottomSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const leftValue = document.getElementById('leftValue');
  const bottomValue = document.getElementById('bottomValue');
  const sizeValue = document.getElementById('sizeValue');
  const resetButton = document.getElementById('resetButton');
  const closeButton = document.getElementById('closeButton');

  const defaults = { left:22, bottom:112, size:72 };
  let settingsOpen = false;

  const art = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="tierBorder">
        <path class="lineHeavy" d="M50 4 L96 50 L50 96 L4 50 Z"/>
        <path class="lineMedium" d="M50 9 L91 50 L50 91 L9 50 Z"/>
        <path class="lineFine" d="M50 4 V0 M50 96 V100 M4 50 H0 M96 50 H100"/>
        <path class="lineFine" d="M50 4 l-5 7 M50 4 l5 7 M50 96 l-5-7 M50 96 l5-7"/>
        <path class="lineFine" d="M4 50 l7-5 M4 50 l7 5 M96 50 l-7-5 M96 50 l-7 5"/>
        <circle class="solid" cx="50" cy="8.3" r="1.0"/>
        <circle class="solid" cx="91.7" cy="50" r="1.0"/>
        <circle class="solid" cx="50" cy="91.7" r="1.0"/>
        <circle class="solid" cx="8.3" cy="50" r="1.0"/>

        <g class="edgeRunes lineFine">
          <path d="M28 20 L31 25 L31 17 M31 21 L27 17 M31 21 L35 17"/>
          <path d="M69 25 L69 17 M65 21 L69 17 L73 21"/>
          <path d="M79 30 L84 34 L79 38"/>
          <path d="M82 61 L78 65 L83 68 L79 72"/>
          <path d="M70 76 L70 84 M70 78 L74 76 M70 81 L73 80"/>
          <path d="M30 76 L30 84 M30 79 L26 82 M30 79 L34 82"/>
          <path d="M18 61 L22 64 L19 68 L23 72"/>
          <path d="M21 30 L16 34 L21 38"/>
        </g>
      </g>

      <g class="tierMoons">
        <path class="solid" d="M38 38 A12 12 0 1 0 38 62 A9 12 0 0 1 38 38 Z"/>
        <path class="solid" d="M62 38 A12 12 0 1 1 62 62 A9 12 0 0 0 62 38 Z"/>
        <path class="lineFine" d="M24 50 H27 M73 50 H76"/>
      </g>

      <g class="tierSword">
        <path class="solid" d="M50 12 L53 18 L52 66 L50 72 L48 66 L47 18 Z"/>
        <path class="lineFine" d="M50 18 V66"/>
        <path class="solid" d="M36 69 L64 69 L60 73 L40 73 Z"/>
        <rect class="solid" x="48.2" y="72.5" width="3.6" height="12" rx=".8"/>
        <path class="lineFine" d="M48.5 76 H51.5 M48.5 79 H51.5 M48.5 82 H51.5"/>
        <circle class="solid" cx="50" cy="88" r="3.1"/>
        <path class="lineFine" d="M47.8 88 H52.2 M50 85.8 V90.2"/>
      </g>
    </svg>`;

  base.innerHTML = art;
  charged.innerHTML = art;

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, Number(v) || 0));
  }

  function setFill(value) {
    const p = clamp(value, 0, 1);
    charged.style.clipPath = `inset(${((1 - p) * 100).toFixed(2)}% 0 0 0)`;
  }

  function setMode(mode) {
    widget.classList.remove('unequipped', 'blocked', 'cooling', 'ready');
    widget.classList.add(mode);
  }

  function setTier(tier) {
    const t = Math.max(1, Math.min(3, Number(tier) || 1));
    widget.classList.remove('tier1', 'tier2', 'tier3');
    widget.classList.add(`tier${t}`);
  }

  function updateSliderBounds() {
    const size = clamp(sizeSlider.value, 40, 200);
    leftSlider.max = String(Math.max(0, Math.floor(window.innerWidth - size)));
    bottomSlider.max = String(Math.max(0, Math.floor(window.innerHeight - size)));
  }

  function setLayout(left, bottom, size) {
    const safeSize = clamp(size, 40, 200);
    const safeLeft = clamp(left, 0, 4000);
    const safeBottom = clamp(bottom, 0, 4000);
    document.documentElement.style.setProperty('--left', `${safeLeft}px`);
    document.documentElement.style.setProperty('--bottom', `${safeBottom}px`);
    document.documentElement.style.setProperty('--size', `${safeSize}px`);
  }

  function readSliderLayout() {
    return {
      left: Math.round(Number(leftSlider.value) || 0),
      bottom: Math.round(Number(bottomSlider.value) || 0),
      size: Math.round(Number(sizeSlider.value) || 72)
    };
  }

  function refreshSettingLabels() {
    const v = readSliderLayout();
    leftValue.textContent = `${v.left} px`;
    bottomValue.textContent = `${v.bottom} px`;
    sizeValue.textContent = `${v.size} px`;
  }

  function applySlidersLive() {
    updateSliderBounds();
    const v = readSliderLayout();
    setLayout(v.left, v.bottom, v.size);
    refreshSettingLabels();
  }

  function persistSliders() {
    const v = readSliderLayout();
    try {
      if (typeof window.HEHUDApply === 'function') window.HEHUDApply(`${v.left}|${v.bottom}|${v.size}`);
    } catch (_) {}
  }

  function setSliderValues(left, bottom, size) {
    sizeSlider.value = String(clamp(size, 40, 200));
    updateSliderBounds();
    leftSlider.value = String(clamp(left, 0, Number(leftSlider.max)));
    bottomSlider.value = String(clamp(bottom, 0, Number(bottomSlider.max)));
    applySlidersLive();
  }

  [leftSlider, bottomSlider, sizeSlider].forEach(slider => {
    slider.addEventListener('input', applySlidersLive);
    slider.addEventListener('change', () => {
      applySlidersLive();
      persistSliders();
    });
  });

  resetButton.addEventListener('click', () => {
    setSliderValues(defaults.left, defaults.bottom, defaults.size);
    persistSliders();
  });

  closeButton.addEventListener('click', () => {
    persistSliders();
    try { if (typeof window.HEHUDClose === 'function') window.HEHUDClose(''); } catch (_) {}
  });

  window.addEventListener('resize', () => {
    if (settingsOpen) applySlidersLive();
  });

  document.addEventListener('keydown', e => {
    if (!settingsOpen) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      persistSliders();
      try { if (typeof window.HEHUDClose === 'function') window.HEHUDClose(''); } catch (_) {}
    }
  });

  window.TechniqueHUD = {
    setLayout,

    openSettings(left, bottom, size) {
      setSliderValues(left, bottom, size);
      settingsOpen = true;
      document.body.classList.add('settings-open');
      panel.setAttribute('aria-hidden', 'false');
    },

    closeSettings() {
      settingsOpen = false;
      document.body.classList.remove('settings-open');
      panel.setAttribute('aria-hidden', 'true');
    },

    setState(state) {
      if (!state || !state.equipped) {
        setTier(1);
        setFill(0);
        setMode('unequipped');
        return;
      }

      setTier(state.tier);

      if (state.cooling) {
        setFill(state.progress);
        setMode('cooling');
        return;
      }

      setFill(1);
      setMode(state.conditionsValid ? 'ready' : 'blocked');
    }
  };
})();
</script>
</body>
</html>
